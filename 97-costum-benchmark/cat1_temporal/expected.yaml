tests:
  uaf_reuse_exhaust:
    purpose: "大分配(>256MB)耗尽quarantine后旧指针UAF"
    baseline: { exit: 0, verdict: MISS }
    rsan-orig: { exit: 0, verdict: MISS }
    mixsan:    { exit: 133, verdict: DETECT, probability: "62/63" }
    note: >
      通过分配+释放>256MB内存(32MB×10=320MB)强制驱逐victim出quarantine。
      RSan: victim必然已离开quarantine→bound恢复→必然MISS。
      MixSan: MemTag mismatch→DETECT。这是MemTag相比RSan最具区分度的测试。

  df_interleaved:
    purpose: "quarantine驱逐后slot被复用，再次free同一指针 — DF检测"
    baseline: { exit: 0, verdict: MISS }
    rsan-orig: { exit: 0, verdict: MISS }
    mixsan:    { exit: 133, verdict: DETECT }
    note: >
      与uaf_reuse_exhaust共享前置条件: 先free victim，用大量分配填满quarantine → victim被驱逐。
      此后slot被复用，再次free(victim)。
      RSan: slot已复用→*meta_ptr≠0→检查失败→MISS。
      MixSan: 旧指针MemTag与当前slot元数据不匹配→DETECT。
      DF与UAF的区别仅在于最后的攻击动作(free vs deref)，触发RSan的不同检查路径。
