tests:
  oob_skip_redzone:
    purpose: "越界访问跳过redzone命中相邻对象 — MixSan MemTag第二道防线"
    baseline: { exit: 0, verdict: MISS }
    rsan-orig: { exit: 0, verdict: MISS }
    mixsan:    { exit: 133, verdict: DETECT, probability: "62/63" }
    note: >
      RSan只有spatial check一道防线。OOB跳过redzone命中相邻对象的合法区间时，
      spatial check通过 → MISS。MixSan的Stage 2 (Temporal check)比较指针MemTag
      与目标元数据MemTag，两个独立分配几乎必然不同 → DETECT。
      碰撞仅当MemTag(a)==MemTag(b)时发生(1/63概率, 需要相隔63×slot_size)。

  oob_far_jump:
    purpose: "大跨度越界命中不同size class对象"
    baseline: { exit: 0, verdict: MISS }
    rsan-orig: { exit: 0, verdict: MISS }
    mixsan:    { exit: 133, verdict: DETECT, probability: "62/63" }
    note: >
      验证MemTag mismatch在不同size class间的检测能力。

  oob_memtag_second_defense:
    purpose: "多对象场景验证MemTag为spatial check提供第二道防线"
    baseline: { exit: 0, verdict: MISS }
    rsan-orig: { exit: 0, verdict: MISS }
    mixsan:    { exit: 133, verdict: DETECT, probability: "62/63" }
    note: >
      5个同大小对象中, 从obj[0]越界到obj[1]。
      MemTag碰撞理论概率1/63 — 对象在同一size class区域内offset满足
      (offset_a/slot_size)%63 == (offset_b/slot_size)%63 时碰撞。
      此条件在正常分配模式下几乎不可能满足, 因此实际检测率~100%。
